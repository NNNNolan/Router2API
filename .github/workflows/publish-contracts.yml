name: Publish Router.Contracts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'NuGet package version (for example 2.0.0)'
        required: true
        type: string
      nuget_user:
        description: 'nuget.org profile username (not email)'
        required: true
        type: string

concurrency:
  group: publish-router-contracts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # 手动发布旧 tag 时，比较脚本仍取自本次选择的工作流分支。
      - name: Check out publishing tools and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compare Contracts DLL content
        id: changes
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}
        run: |
          $version = if ($env:MANUAL_VERSION) { $env:MANUAL_VERSION } else { $env:GITHUB_REF_NAME.Substring(1) }
          ./.github/scripts/compare-contracts.ps1 -Version $version -Revision $env:RELEASE_REF
      - name: Check out release source
        if: steps.changes.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.changes.outputs.revision }}
      - name: Check nuget.org username
        if: steps.changes.outputs.changed == 'true'
        env:
          NUGET_USER: ${{ inputs.nuget_user || vars.NUGET_USER || secrets.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "::error::Set NUGET_USER to your nuget.org profile username in this repository's Actions Variables or Secrets."
            exit 1
          fi
      - name: Pack Router.Contracts
        if: steps.changes.outputs.changed == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.changes.outputs.version }}
        run: |
          dotnet pack src/Router.Contracts/Router.Contracts.csproj -c Release -p:Version="$PACKAGE_VERSION" -o artifacts/packages
      - name: NuGet login
        if: steps.changes.outputs.changed == 'true'
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ inputs.nuget_user || vars.NUGET_USER || secrets.NUGET_USER }}
      - name: Publish to nuget.org
        if: steps.changes.outputs.changed == 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
