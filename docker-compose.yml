services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - router2api-redis:/data

  router2api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "127.0.0.1:5242:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: Asia/Shanghai
      ROUTER2API_Database__Path: /app/data/router2api.db
      ROUTER2API_Redis__ConnectionString: redis:6379
      ROUTER2API_Redis__InstanceName: "router2api:"
      ROUTER2API_Auth__Admin__Users__0__Username: ${ROUTER_ADMIN_USERNAME:-admin}
      ROUTER2API_Auth__Admin__Users__0__Password: ${ROUTER_ADMIN_PASSWORD:?请设置新的管理员密码}
      ROUTER2API_Auth__ApiKey__Key: ${ROUTER_API_KEY:?请设置新的下游API密钥}
    volumes:
      - ./volumes/data:/app/data
      - ./volumes/plugins:/app/plugins
      - ./volumes/Config:/app/Config

volumes:
  router2api-redis:
